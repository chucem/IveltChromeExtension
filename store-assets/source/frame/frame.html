<!doctype html>
<!-- The blue frame around each store image. render.py loads it, calls render(shot) with the shot
     from shots.json (its page captures already added as data URLs), and takes the screenshot. -->
<html dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/vendor/font-awesome/css/font-awesome.min.css">
<style>
  @font-face { font-family: Rubik; src: url(fonts/Rubik.ttf); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; }
  /* render.py sets the viewport to the image's size */
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Rubik, sans-serif; color: #fff; position: relative;
    background:
      radial-gradient(circle at 70% 18%, rgba(255,255,255,.16), transparent 45%),
      linear-gradient(140deg, #0a4f86 0%, #1180c8 55%, #12a0e6 100%);
  }
  body::before {
    content: ''; position: absolute; inset: 0; opacity: .12;
    background-image: radial-gradient(#fff 1px, transparent 1.4px); background-size: 22px 22px;
  }

  /* the text column, on the right */
  .side { position: absolute; right: 56px; width: 420px; top: 50%; transform: translateY(-50%); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand img { width: 44px; height: 44px; background: #fff; border-radius: 10px; padding: 4px; }
  .brand b { font-size: 17px; font-weight: 600; }
  .brand span { font-size: 14px; font-weight: 500; opacity: .85; direction: ltr; }
  h1 { font-size: 46px; font-weight: 800; line-height: 1.22; margin-bottom: 14px; }
  h1 em, .tile h1 em { font-style: normal; color: #ffd257; }
  .sub { direction: ltr; text-align: right; font-size: 19px; font-weight: 500; line-height: 1.3; opacity: .95; margin-bottom: 26px; }
  ul.features { list-style: none; padding: 0; display: grid; gap: 14px; }
  .features li { display: flex; align-items: center; gap: 14px; }
  .features i.fa { flex: none; width: 38px; height: 38px; border-radius: 9px; background: #fff; color: #1180c8;
    display: grid; place-items: center; font-size: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .features .yi { font-size: 18px; font-weight: 600; line-height: 1.2; }
  .features .en { direction: ltr; text-align: right; font-size: 12.5px; opacity: .8; margin-top: 2px; }
  .new { display: inline-block; font-size: 11px; font-weight: 700; color: #6b4a00; background: #ffd257;
    border-radius: 10px; padding: 1px 8px; margin-inline-start: 6px; vertical-align: 2px; }

  /* the browser window, on the left */
  .window { position: absolute; background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,20,50,.35); direction: ltr; }
  .window .bar { height: 38px; background: #f1f3f6; display: flex; align-items: center; padding: 0 14px; gap: 8px; border-bottom: 1px solid #e2e6ea; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url { flex: 1; margin: 0 14px 0 22px; height: 26px; border-radius: 13px; background: #fff; border: 1px solid #e0e4e8;
    font: 13px/24px Rubik, sans-serif; color: #444; padding: 0 12px; display: flex; gap: 7px; align-items: center; }
  .url .fa { color: #2a9d4b; font-size: 12px; }
  .ext { position: relative; width: 24px; height: 24px; }
  .ext img { width: 24px; height: 24px; }
  .ext b { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
    background: #d6282f; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 1.5px solid #f1f3f6; }
  .window .stage { display: block; width: 100%; }

  /* close-ups of parts of the page */
  .callout { position: absolute; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 44px rgba(0,20,50,.38); border: 1px solid rgba(255,255,255,.7); }
  .callout img { display: block; }
  .plain { position: absolute; border-radius: 12px; box-shadow: 0 18px 44px rgba(0,20,50,.38); }

  /* the keyboard shortcuts */
  .keys { position: absolute; left: 68px; top: 50%; transform: translateY(-50%); width: 720px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .key { background: rgba(255,255,255,.96); color: #17324d; border-radius: 14px; padding: 18px 20px;
    display: flex; align-items: center; gap: 16px; box-shadow: 0 12px 30px rgba(0,20,50,.18); }
  .key.wide { grid-column: span 2; }
  .key .combo { display: flex; align-items: center; gap: 7px; direction: ltr; flex: none; }
  .key kbd { min-width: 46px; height: 44px; padding: 0 12px; border-radius: 9px; background: #fff; border: 1px solid #d5dde6;
    box-shadow: 0 3px 0 #c6d0db; display: grid; place-items: center; font: 600 17px Rubik, sans-serif; }
  .key .plus { color: #8aa0b5; font-weight: 600; }
  .key .yi { font-size: 18px; font-weight: 600; }
  .key .en { font-size: 13px; color: #6b7f93; direction: ltr; text-align: right; margin-top: 3px; }

  /* the small promo tile */
  .tile .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tile .logo { width: 86px; height: 86px; background: #fff; border-radius: 20px; padding: 8px; box-shadow: 0 10px 26px rgba(0,20,50,.25); margin-bottom: 12px; }
  .tile h1 { font-size: 34px; margin: 0; line-height: 1.15; }
  .tile .en { font-size: 14px; font-weight: 600; opacity: .9; margin: 4px 0 14px; }
  .tile .chips { display: flex; gap: 8px; }
  .tile .chips span { font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.14);
    border-radius: 14px; padding: 4px 11px; }
</style>
</head>
<body>
<script>
const ICON = '../../../extension/img/icon128.png';
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
// *word* in a title is drawn in yellow
const title = t => t.replace(/\*([^*]+)\*/g, '<em>$1</em>');

function side(shot) {
  const s = el('div', 'side');
  s.append(el('div', 'brand', `<img src="${ICON}"><b>אייוועלט העלפער</b><span>iVelt Helper</span>`));
  s.append(el('h1', '', title(shot.title)));
  s.append(el('div', 'sub', shot.subtitle));
  const ul = el('ul', 'features');
  for (const f of shot.features || [])
    ul.append(el('li', '', `<i class="fa fa-${f.icon}"></i><div><div class="yi">${f.yi}${f.new ? '<span class="new">נייע</span>' : ''}</div><div class="en">${f.en}</div></div>`));
  s.append(ul);
  document.body.append(s);
}

function windowFrame(shot) {
  const w = shot.window, win = el('div', 'window');
  Object.assign(win.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px' });
  const bar = el('div', 'bar', '<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>');
  bar.append(el('div', 'url', `<i class="fa fa-lock"></i>${shot.url}`));
  bar.append(el('div', 'ext', `<img src="${ICON}">${shot.badge ? `<b>${shot.badge}</b>` : ''}`));
  win.append(bar);
  const img = el('img', 'stage'); img.src = shot.stageImage;
  if (w.h) { img.style.height = (w.h - 38) + 'px'; img.style.objectFit = 'cover'; img.style.objectPosition = 'top'; }
  win.append(img);
  document.body.append(win);
}

function callouts(shot) {
  for (const c of shot.calloutImages || []) {
    const box = el('div', c.plain ? 'plain' : 'callout');
    Object.assign(box.style, { left: c.x + 'px', top: c.y + 'px' });
    const img = el('img'); img.src = c.src; img.style.width = c.w + 'px'; img.style.height = c.h + 'px';
    if (c.plain) img.style.borderRadius = '12px';
    box.append(img);
    document.body.append(box);
  }
}

function keys(shot) {
  const g = el('div', 'keys');
  for (const k of shot.keys) {
    // "combo" is pressed together (Alt + N), "alt" is either key (← / →)
    const combo = k.alt ? k.alt.map(c => `<kbd>${c}</kbd>`).join('')
                        : k.combo.map(c => `<kbd>${c}</kbd>`).join('<span class="plus">+</span>');
    g.append(el('div', 'key' + (k.wide ? ' wide' : ''), `<div class="combo">${combo}</div><div><div class="yi">${k.yi}</div><div class="en">${k.en}</div></div>`));
  }
  document.body.append(g);
}

function tile(shot) {
  document.body.className = 'tile';
  const c = el('div', 'center');
  c.append(el('img', 'logo')); c.lastChild.src = ICON;
  c.append(el('h1', '', title(shot.title)));
  c.append(el('div', 'en', shot.subtitle));
  c.append(el('div', 'chips', shot.chips.map(x => `<span>${x}</span>`).join('')));
  document.body.append(c);
}

window.render = async shot => {
  if (shot.kind === 'tile') tile(shot);
  else {
    side(shot);
    if (shot.stageImage) windowFrame(shot);
    if (shot.keys) keys(shot);
    callouts(shot);
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
};
</script>
</body>
</html>
