# Creates a GitHub release whenever the version in extension/manifest.json changes on master.
# Merging a version bump is the release: the workflow tags the merge as v<version>,
# builds the zip and attaches it to the release.
# If a release for that version already exists, it does nothing.
#
# The notes start with a summary written by AI (Google Gemini, free tier) from the
# commits since the previous release, when the GEMINI_API_KEY secret is set - see
# .github/scripts/ai-release-notes.sh. If the AI notes can't be written, the run fails
# and nothing is published: re-run the failed job, or skip them with "Run workflow ->
# Skip AI release notes" (or the SKIP_AI_NOTES=true repository variable), which
# publishes with GitHub's usual notes.
#
# Store uploads are a separate, manual step: see store-upload.yml.

name: Release

on:
  push:
    branches:
      - master
    paths:
      - extension/manifest.json
  workflow_dispatch:
    inputs:
      skip_ai_notes:
        description: 'Skip AI release notes (publish with the usual notes)'
        type: boolean
        default: false

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and tags, so the AI notes can see what changed since the last release

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid manifest version: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/ivelt-helper-$version.zip" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::Release v$version already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cd extension
          # The "key" only pins the extension ID for local unpacked testing; the store rejects it
          jq 'del(.key)' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r -X "../${{ steps.version.outputs.zip }}" . -x '_metadata/*'

      - name: Write release notes with AI
        if: steps.version.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_AI_NOTES: ${{ github.event.inputs.skip_ai_notes == 'true' || vars.SKIP_AI_NOTES == 'true' }}
        run: bash .github/scripts/ai-release-notes.sh release

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        run: |
          # The AI summary (if there is one) goes before GitHub's list of changes
          notes=()
          if [ -s ai-notes.md ]; then notes=(--notes-file ai-notes.md); fi
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            "${notes[@]}" \
            --generate-notes
